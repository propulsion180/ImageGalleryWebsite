spring.application.name=server
auth.jwt.secret=${SERVER_JWT_SECRET}
storage.base-path=${STORAGE_BASE_PATH:../images}
db.path=${DB_PATH:/home/gallery}
spring.datasource.url=jdbc:sqlite:${db.path}/gallery.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB
server.tomcat.max-swallow-size=40MB

owner.username=${OWNER_USERNAME:admin}
owner.password=${OWNER_PASSWORD:change-asap}

